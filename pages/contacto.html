<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Contacto | Tecnologías Web</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>

        <header>
            <h1>Buzón de Contacto y Consultas</h1>
            <nav aria-label="Menú principal">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="sociedad.html">Impacto Social</a></li>
                    <li><a href="negocios.html">Impacto en Negocios</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Formulario de Comunicación</h2>
                <p>Complete los siguientes campos para enviar sus Consultas acerca del proyecto o del Impacto Tecnológico:</p>

            <!------------Requisitos: form, label, input, textarea, button -->>
            <form action="#" method="post">
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre y apellido" required minlength="3">
                </div>

                <div class="campo">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@utpl.edu.ec" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de su mensaje" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escriba su consulta detallada..." required></textarea>
                </div>

                <div class="campo">
                    <button type="submit">Enviar mensaje</button>
                </div>
            </form>
            </section>
        </main>

        <footer>
            <p>&copy; Universidad Técnica Particular de Loja</p>
        </footer>

    </body>
</html>
